<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .card { border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .form-label { font-weight: 500; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <h1 class="text-center mb-4">Hotel Search</h1>
            <p class="text-center text-muted mb-4">Search hotels near any location via Google Maps</p>

            <div class="card p-4">
                <form method="POST" action="/search">
                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" class="form-control" id="location" name="location"
                               placeholder="e.g. Yokohama Station, Tokyo Tower, Shinjuku" required>
                        <div class="form-text">Address or landmark (any language)</div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="date" class="form-label">Check-in Date</label>
                            <input type="date" class="form-control" id="date" name="date" value="2026-07-04">
                        </div>
                        <div class="col-md-6">
                            <label for="nights" class="form-label">Nights</label>
                            <select class="form-select" id="nights" name="nights">
                                <option value="1">1 night</option>
                                <option value="2" selected>2 nights</option>
                                <option value="3">3 nights</option>
                                <option value="4">4 nights</option>
                                <option value="5">5 nights</option>
                                <option value="7">7 nights</option>
                                <option value="14">14 nights</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="count" class="form-label">Number of Hotels</label>
                            <select class="form-select" id="count" name="count">
                                <option value="5">5</option>
                                <option value="10" selected>10</option>
                                <option value="15">15</option>
                                <option value="20">20</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="sort" class="form-label">Sort By</label>
                            <select class="form-select" id="sort" name="sort">
                                <option value="distance">Distance (near to far)</option>
                                <option value="price">Price (high to low)</option>
                                <option value="rating">Rating (high to low)</option>
                                <option value="star">Star class (high to low)</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Search Hotels</button>
                    </div>
                </form>
            </div>

            <p class="text-center text-muted mt-3 small">
                Powered by DeepSeek + Browser-Use | Results from Google Maps
            </p>
        </div>
    </div>
</div>
</body>
</html>
