<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Search Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .card { border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .hotel-name { font-weight: 600; }
        .feature-badge { font-size: 0.75rem; }
        .spinner-grow { width: 1rem; height: 1rem; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">

            <!-- Loading State -->
            <div id="loading-section" class="text-center py-5">
                <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <h4 id="progress-text">Starting search...</h4>
                <p class="text-muted">This may take 1-2 minutes</p>
                <div class="progress mt-3" style="height: 6px;">
                    <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
                </div>
            </div>

            <!-- Error State -->
            <div id="error-section" class="d-none text-center py-5">
                <div class="text-danger mb-3" style="font-size: 3rem;">&#9888;</div>
                <h4>Search Failed</h4>
                <p id="error-text" class="text-muted"></p>
                <a href="/" class="btn btn-primary mt-3">Try Again</a>
            </div>

            <!-- Results State -->
            <div id="results-section" class="d-none">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 id="result-title" class="mb-1"></h3>
                        <p id="result-subtitle" class="text-muted mb-0"></p>
                    </div>
                    <a href="/" class="btn btn-outline-primary">New Search</a>
                </div>

                <div id="partial-warning" class="alert alert-warning d-none" role="alert">
                    Partial results returned. Some hotels may be missing due to search limitations.
                </div>

                <div class="card">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th><input type="checkbox" id="select-all" class="form-check-input"></th>
                                    <th>#</th>
                                    <th>Hotel</th>
                                    <th class="text-end">Price</th>
                                    <th class="text-center">Rating</th>
                                    <th>Star</th>
                                    <th>Distance</th>
                                    <th>Features</th>
                                </tr>
                            </thead>
                            <tbody id="hotel-tbody">
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3">
                    <a id="maps-link" href="#" target="_blank" class="btn btn-outline-secondary btn-sm">
                        View on Google Maps
                    </a>
                    <button id="report-btn" class="btn btn-success btn-lg d-none" onclick="generateReport()">
                        Generate Report for Selected Hotels
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
const taskId = "{{ task_id }}";
let allHotels = [];

const evtSource = new EventSource(`/stream/${taskId}`);

evtSource.addEventListener("progress", (e) => {
    const data = JSON.parse(e.data);
    document.getElementById("progress-text").textContent = data.progress;
});

evtSource.addEventListener("done", (e) => {
    evtSource.close();
    const data = JSON.parse(e.data);
    setTimeout(() => {
        document.getElementById("loading-section").classList.add("d-none");
        showResults(data);
    }, 500);
});

evtSource.addEventListener("error", (e) => {
    evtSource.close();
    document.getElementById("loading-section").classList.add("d-none");
    document.getElementById("error-section").classList.remove("d-none");
    try {
        const data = JSON.parse(e.data);
        document.getElementById("error-text").textContent = data.error;
    } catch {
        document.getElementById("error-text").textContent = "Connection lost";
    }
});

function showResults(data) {
    document.getElementById("results-section").classList.remove("d-none");

    document.getElementById("result-title").textContent =
        `Hotels near ${data.location}`;
    document.getElementById("result-subtitle").textContent =
        `${data.check_in} ~ ${data.check_out} (${data.nights} nights) | Sorted by ${data.sort}`;
    document.getElementById("maps-link").href = data.maps_url;

    if (data.partial) {
        document.getElementById("partial-warning").classList.remove("d-none");
    }

    allHotels = data.hotels;
    const tbody = document.getElementById("hotel-tbody");
    data.hotels.forEach((h, i) => {
        const tr = document.createElement("tr");
        const priceStr = h.price ? `${h.currency} ${Math.round(h.price)}` : "-";
        const features = (h.features || []).slice(0, 3)
            .map(f => `<span class="badge bg-light text-dark feature-badge">${f}</span>`).join(" ");

        tr.innerHTML = `
            <td><input type="checkbox" class="form-check-input hotel-cb" data-idx="${i}"></td>
            <td class="text-muted">${i + 1}</td>
            <td class="hotel-name">${h.name}</td>
            <td class="text-end">${priceStr}</td>
            <td class="text-center">${h.rating}</td>
            <td>${h.star_class}</td>
            <td>${h.distance}</td>
            <td>${features}</td>
        `;
        tbody.appendChild(tr);
    });

    // Show report button if hotels found
    if (data.hotels.length > 0) {
        document.getElementById("report-btn").classList.remove("d-none");
    }

    // Select all checkbox
    document.getElementById("select-all").addEventListener("change", (e) => {
        document.querySelectorAll(".hotel-cb").forEach(cb => cb.checked = e.target.checked);
    });
}

function generateReport() {
    const selected = [];
    document.querySelectorAll(".hotel-cb:checked").forEach(cb => {
        const idx = parseInt(cb.dataset.idx);
        selected.push(allHotels[idx]);
    });

    if (selected.length === 0) {
        alert("Please select at least one hotel.");
        return;
    }

    // Submit via form to POST endpoint
    const form = document.createElement("form");
    form.method = "POST";
    form.action = "/report";
    form.style.display = "none";

    const input = document.createElement("input");
    input.type = "hidden";
    input.name = "hotels";
    input.value = JSON.stringify(selected);
    form.appendChild(input);

    document.body.appendChild(form);
    form.submit();
}
</script>
</body>
</html>
